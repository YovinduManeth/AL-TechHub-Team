    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="container py-5">


        <!-- Page Heading -->

        <div class="admin-page-heading mb-4">

            <p class="admin-label mb-1">
                QUIZ MANAGEMENT
            </p>

            <h1 class="fw-bold mb-2">
                Quiz Bank
            </h1>

            <p class="text-muted mb-0">
                Create and manage assessment questions for each
                subject and unit.
            </p>

        </div>



        <!-- =========================================
             QUESTION FORM
        ========================================== -->

        <div class="row justify-content-center">

            <div class="col-lg-9 col-xl-8">

                <div class="admin-upload-card">


                    <!-- Card Header -->

                    <div class="admin-upload-header">

                        <div class="admin-upload-icon">

                            <i class="bi bi-question-square-fill"></i>

                        </div>


                        <div>

                            <h4 class="fw-bold mb-1">
                                Add Quiz Question
                            </h4>

                            <p class="mb-0">
                                Add a multiple-choice question to the
                                selected unit.
                            </p>

                        </div>

                    </div>



                    <!-- Form Body -->

                    <div class="admin-upload-body">

                        <form>


                            <!-- Grade -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">

                                    <i class="bi bi-mortarboard me-1"></i>

                                    Grade

                                </label>


                                <select
                                    class="form-select"
                                    required
                                >

                                    <option
                                        value=""
                                        selected
                                        disabled
                                    >
                                        -- Select Grade --
                                    </option>

                                    <option value="12">
                                        Grade 12
                                    </option>

                                    <option value="13">
                                        Grade 13
                                    </option>

                                </select>

                            </div>



                            <!-- Subject -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">

                                    <i class="bi bi-book me-1"></i>

                                    Subject

                                </label>


                                <select
                                    class="form-select"
                                    required
                                >

                                    <option
                                        value=""
                                        selected
                                        disabled
                                    >
                                        -- Select Subject --
                                    </option>

                                    <option value="sft">
                                        Science for Technology (SFT)
                                    </option>

                                    <option value="et">
                                        Engineering Technology (ET)
                                    </option>

                                    <option value="bst">
                                        Bio Systems Technology (BST)
                                    </option>

                                    <option value="ict">
                                        Information & Communication Technology (ICT)
                                    </option>

                                    <option value="agriculture">
                                        Agriculture
                                    </option>

                                </select>

                            </div>

                            <!-- Unit -->

                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    <i class="bi bi-layers me-1"></i>

                                    Unit

                                </label>


                                <select
                                    class="form-select"
                                    required
                                >

                                    <option
                                        value=""
                                        selected
                                        disabled
                                    >
                                        -- Select Unit --
                                    </option>

                                    <option value="unit1">
                                        Unit 01
                                    </option>

                                    <option value="unit2">
                                        Unit 02
                                    </option>

                                    <option value="unit3">
                                        Unit 03
                                    </option>

                                </select>

                            </div>



                            <!-- Question -->

                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    <i class="bi bi-chat-square-text me-1"></i>

                                    Question

                                </label>


                                <textarea
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter the question..."
                                    required
                                ></textarea>

                            </div>
